<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#488286" />
      <stop offset="100%" stop-color="#2d5558" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387ed1" />
      <stop offset="100%" stop-color="#00d09c" />
    </linearGradient>
  </defs>

  <!-- Background tile with subtle rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#omniGrad)" />

  <!-- Outer terminal geometric ring -->
  <circle cx="32" cy="32" r="23" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="4 3" />

  <!-- Multi-leg execution arrows / Institutional Chevrons -->
  <!-- Left Leg / Wing -->
  <path d="M19 37 L32 23 L45 37" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Rising Trend Impulse -->
  <path d="M25 43 L32 35 L39 43" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Execution Pulse Dot -->
  <circle cx="32" cy="16" r="3.5" fill="#00d09c" />
</svg>
